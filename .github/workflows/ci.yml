# CI：静态检查、协议向量、CTS、x86_64 与 aarch64 C++ 协议库测试。
# Android 工程出现后再加 android-build job（M1）。
name: ci

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema zstandard cryptography
      - run: python tools/check_links.py
      - run: python tools/check_kmp_ready.py
      - run: python tools/codec_ref/check_caps.py
      - run: python tools/codec_ref/gen_vectors.py --check

  vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest jsonschema zstandard cryptography
      - run: python -m pytest conformance -m static -q

  cts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest jsonschema zstandard cryptography
      - run: python -m pytest conformance -m dynamic -q

  agent-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake g++ libssl-dev
      - run: cmake -S agent -B agent/build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build agent/build -j
      - run: ctest --test-dir agent/build --output-on-failure

  agent-aarch64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - name: Build & test in arm64 container (QEMU)
        run: |
          docker run --rm --platform linux/arm64 \
            -v "${{ github.workspace }}:/src" -w /src ubuntu:24.04 \
            bash -c "apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y cmake g++ libssl-dev && \
                     cmake -S agent -B agent/build-arm64 -DCMAKE_BUILD_TYPE=Release && \
                     cmake --build agent/build-arm64 -j2 && \
                     ctest --test-dir agent/build-arm64 --output-on-failure"
