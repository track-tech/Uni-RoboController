# CI：静态检查、协议向量、CTS（Python ref + C++ mock）、ASAN、浸泡、x86_64/aarch64 构建。
# Android 工程在 S4 加入 android-build job。
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema zstandard cryptography
      - run: python tools/check_links.py
      - run: python tools/check_kmp_ready.py
      - run: python tools/codec_ref/check_caps.py
      - run: python tools/codec_ref/gen_vectors.py --check

  vectors:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest jsonschema zstandard cryptography
      - run: python -m pytest conformance -m static -q

  cts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest jsonschema zstandard cryptography
      - name: CTS dynamic (Python ref)
        env:
          URC_CTS_REPORT: conformance/cts-report.json
        run: python -m pytest conformance -m dynamic -q --tb=short
      - name: Check report
        run: python tools/check_cts_report.py --suite dynamic --dynamic conformance/cts-report.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cts-ref-report
          path: conformance/cts-report.json

  mock-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest jsonschema zstandard cryptography
      - run: sudo apt-get update && sudo apt-get install -y cmake g++ libssl-dev
      - name: Build mock
        run: |
          cmake -S agent -B agent/build -DCMAKE_BUILD_TYPE=Release -DURC_BUILD_APPS=ON -DURC_WERROR=ON
          cmake --build agent/build -j
          ctest --test-dir agent/build --output-on-failure
      - name: CTS dynamic (C++ mock)
        env:
          URC_CTS_MOCK_BIN: ${{ github.workspace }}/agent/build/mock_robot
          URC_CTS_REQUIRE_EXTERNAL: "1"
          URC_CTS_REPORT: conformance/cts-mock-report.json
        run: python -m pytest conformance -m dynamic -q --tb=short
      - name: Check report
        run: python tools/check_cts_report.py --suite dynamic --dynamic conformance/cts-mock-report.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cts-mock-report
          path: |
            conformance/cts-mock-report.json
            conformance/*.log

  mock-asan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest jsonschema zstandard cryptography
      - run: sudo apt-get update && sudo apt-get install -y cmake g++ libssl-dev
      - name: Build ASAN/UBSAN
        run: |
          cmake -S agent -B agent/build-asan -DCMAKE_BUILD_TYPE=Debug -DURC_BUILD_APPS=ON \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          cmake --build agent/build-asan -j
          ctest --test-dir agent/build-asan --output-on-failure
      - name: CTS with ASAN mock
        env:
          URC_CTS_MOCK_BIN: ${{ github.workspace }}/agent/build-asan/mock_robot
          URC_CTS_REQUIRE_EXTERNAL: "1"
          URC_CTS_REPORT: conformance/cts-asan-report.json
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: python -m pytest conformance -m dynamic -q --tb=short
      - name: Check report
        run: python tools/check_cts_report.py --suite dynamic --dynamic conformance/cts-asan-report.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cts-asan-report
          path: conformance/cts-asan-report.json

  mock-soak:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[soak]'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema zstandard cryptography
      - run: sudo apt-get update && sudo apt-get install -y cmake g++ libssl-dev
      - run: cmake -S agent -B agent/build -DCMAKE_BUILD_TYPE=Release -DURC_BUILD_APPS=ON
      - run: cmake --build agent/build -j
      - name: 30 min soak
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: |
          python tools/soak.py --bin agent/build/mock_robot --duration 1800 \
            --rate 100 --drop 5 --seed 1 --report artifacts/soak-report.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-report
          path: artifacts/soak-report.json

  agent-x86_64:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake g++ libssl-dev
      - run: cmake -S agent -B agent/build -DCMAKE_BUILD_TYPE=Release -DURC_BUILD_APPS=ON
      - run: cmake --build agent/build -j
      - run: ctest --test-dir agent/build --output-on-failure

  agent-aarch64:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - name: Build & test in arm64 container (QEMU)
        run: |
          mkdir -p artifacts
          docker run --rm --platform linux/arm64 \
            -v "${{ github.workspace }}:/src" -w /src ubuntu:24.04 \
            bash -c "apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y cmake g++ libssl-dev python3 && \
                     cmake -S agent -B agent/build-arm64 -DCMAKE_BUILD_TYPE=Release -DURC_BUILD_APPS=ON && \
                     cmake --build agent/build-arm64 -j2 && \
                     ctest --test-dir agent/build-arm64 --output-on-failure && \
                     ./agent/build-arm64/mock_robot --help >/dev/null && \
                     python3 tools/gen_arch_report.py --bin agent/build-arm64/urc_vectors \
                       --vectors protocol/vectors --out artifacts/arch-report.json"
      - name: Check arch report
        run: python tools/check_cts_report.py --suite arch --arch artifacts/arch-report.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arch-report
          path: artifacts/arch-report.json
